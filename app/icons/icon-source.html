<!-- Source for the app icon. Rendered to PNG at several sizes via headless
     Chrome screenshots (see ..\..\gen-icons.ps1) — same technique as the book
     PDFs, no binary image files kept in the repo as the "true" source. -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#C0603A"/>
  <circle cx="256" cy="256" r="190" fill="#FBF6EC" opacity="0.08"/>
  <text x="256" y="340" text-anchor="middle"
        font-family="Segoe UI, Tahoma, Arial, sans-serif"
        font-size="300" font-weight="700"
        fill="#FBF6EC">ع</text>
</svg>
</body>
</html>
